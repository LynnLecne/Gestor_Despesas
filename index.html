<!doctype html>
<html lang="pt-PT" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Despesas Pessoais</title>
    <link rel="stylesheet" href="css/style.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
      defer
    ></script>
    <script src="js/script.js" defer></script>
  </head>

  <body>
    <!-- SECÇÃO DE LOGIN (Ecrã Inicial) -->
    <!-- Nota: Podes alternar a visibilidade desta secção e do painel principal via JS -->
    <div id="login-container" class="auth-card">
      <h2>Aceder ao Gestor</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Nome de Utilizador:</label>
          <input
            type="text"
            id="username"
            name="username"
            required
            placeholder="Ex: João Silva"
          />
        </div>
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
    </div>

    <!-- PAINEL PRINCIPAL (App Oculta inicialmente ou visível após login) -->
    <div id="app-container" class="main-app hidden">
      <!-- CABEÇALHO -->
      <header class="app-header">
        <div class="header-left">
          <h1 id="user-welcome">
            Olá, <span id="user-name">Utilizador</span>!
          </h1>
          <div id="quote-widget" class="meta-info" style="font-style: italic">
            <span>A carregar o conselho do dia...</span>
          </div>
        </div>
        <div class="header-right">
          <div id="data-hora-container">
            <span class="relogio-data"></span>
            <span class="relogio-hora"></span>
          </div>
          <button id="theme-toggle" class="btn-secondary">
            Mudar Tema 🌓
          </button>
          <button id="logout-btn" class="btn-danger">Sair</button>
        </div>
      </header>

      <!-- DASHBOARD / RESUMO -->
      <section class="summary-section">
        <div class="balance-card">
          <h3>Total Gasto</h3>
          <p id="total-amount">0.00 €</p>
        </div>
      </section>

      <!-- CONTEÚDO PRINCIPAL (Formulário + Lista) -->
      <main class="app-content">
        <!-- FORMULÁRIO DE REGISTO -->
        <section class="form-section">
          <h2>Registar Despesa</h2>
          <form id="expense-form">
            <!-- Campo oculto para quando editamos uma despesa -->
            <input type="hidden" id="expense-id" />

            <div class="form-group">
              <label for="expense-desc">Descrição:</label>
              <input
                type="text"
                id="expense-desc"
                required
                placeholder="Ex: Supermercado"
              />
            </div>

            <div class="form-group">
              <label for="expense-value">Valor (€):</label>
              <input
                type="number"
                id="expense-value"
                step="0.01"
                min="0.01"
                required
                placeholder="0.00"
              />
            </div>

            <div class="form-group">
              <label for="expense-category">Categoria:</label>
              <select id="expense-category" required>
                <option value="" disabled selected>Escolha uma opção</option>
                <option value="Alimentacao">Alimentação</option>
                <option value="Educacao">Educação</option>
                <option value="Habitacao">Habitação</option>
                <option value="Transportes">Transportes</option>
                <option value="Lazer">Lazer</option>
                <option value="Outros">Outros</option>
              </select>
            </div>

            <button type="submit" id="form-submit-btn" class="btn-primary">
              Adicionar Despesa
            </button>
          </form>
        </section>

        <!-- LISTAGEM E FILTROS -->
        <section class="list-section">
          <div class="list-header">
            <h2>Histórico de Despesas</h2>
            <div class="filter-group">
              <label for="filter-category">Filtrar por:</label>
              <select id="filter-category">
                <option value="all">Todas as Categorias</option>
                <option value="Alimentacao">Alimentação</option>
                <option value="Educacao">Educação</option>
                <option value="Habitacao">Habitação</option>
                <option value="Transportes">Transportes</option>
                <option value="Lazer">Lazer</option>
                <option value="Outros">Outros</option>
              </select>
            </div>
          </div>

          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Descrição</th>
                  <th>Valor</th>
                  <th>Categoria</th>
                  <th>Criado por</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="expense-list"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
